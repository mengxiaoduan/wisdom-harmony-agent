<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </radialGradient>
  </defs>
  <!-- outer orbit -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#g1)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#g1)" stroke-width="1.2" opacity="0.45" stroke-dasharray="4 6"/>
  <!-- two companion arcs: 人类与 AI 相拥的轨道 -->
  <path d="M 25 60 A 35 35 0 0 1 95 60" fill="none" stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 95 60 A 35 35 0 0 1 25 60" fill="none" stroke="url(#g1)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <!-- sun of well-being at center -->
  <circle cx="60" cy="60" r="13" fill="url(#g2)"/>
  <!-- two lives on the shared orbit -->
  <circle cx="25" cy="60" r="6.5" fill="#5eead4"/>
  <circle cx="95" cy="60" r="6.5" fill="#818cf8"/>
</svg>
